server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aset statis (model TFJS, video dictionary, JS/CSS build) — cache lama, nama file sudah di-hash Vite.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /dictionary/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy API ke backend (container terpisah, lihat docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy signaling WebRTC (Socket.io) — WAJIB upgrade header untuk WebSocket
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback — semua route non-file diarahkan ke index.html (React Router-less, tapi App.tsx pakai state internal jadi ini jaga-jaga refresh di path lain)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
